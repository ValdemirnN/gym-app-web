<!DOCTYPE html>
<html lang="pt-BR" style="height:100%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Meu Treino</title>
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meu Treino" />
    <style>
      html, body { height: 100%; margin: 0; background: #111827; }
      body { overflow: hidden; -webkit-text-size-adjust: 100%; }
      #root { display: flex; height: 100%; flex: 1; }
      input, textarea { font-size: 16px; } /* evita zoom automático no iOS */
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o Meu Treino.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
